name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: sidecars/cockpit-cliproxy/go.sum
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:go
      - run: cargo check -p cockpit-tools --locked
        env:
          AIMODEL_DIRECT_SWIFT: '1'
