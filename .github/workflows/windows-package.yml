name: Windows package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - run: npm ci
      - run: npm test
      - name: Build Windows x64 installer
        run: npm run tauri -- build --bundles nsis
      - name: Collect installer and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package-output -Force | Out-Null
          $installers = @(Get-ChildItem target/release/bundle/nsis/*.exe)
          if ($installers.Count -eq 0) { throw 'Windows installer was not produced' }
          foreach ($installer in $installers) {
            Copy-Item $installer.FullName package-output/
            $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($installer.Name)" | Set-Content "package-output/$($installer.Name).sha256" -Encoding ascii
          }
          "Commit: $env:GITHUB_SHA" | Set-Content package-output/BUILD.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: AIModel-Switch-Windows-x64
          path: package-output/
          if-no-files-found: error
          retention-days: 30
